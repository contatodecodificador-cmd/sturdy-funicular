<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<title>Reel 001 · Nogueira Mídias em todo lugar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="../brand/tokens.css">
<style>
/* Modelo @theplatterdotco: logo FIXO no centro, mundo trocando em volta. 241 quadros a 30fps (8,03s), 52 cortes nos quadros medidos do original.
   Cada cena aparece em par: normal e negativo. Sem texto. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0}
.sc{position:absolute;inset:0;overflow:hidden;display:none}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fb{position:absolute;inset:0}
.neg{filter:invert(1) grayscale(1) contrast(1.15)}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;display:flex;flex-direction:column;align-items:center;line-height:1;pointer-events:none}
.logo .w{font-family:Archivo;font-weight:900;font-stretch:100%;font-size:86px;letter-spacing:-.045em}
.logo .w sup{font-size:.28em;font-weight:600;letter-spacing:0;vertical-align:1.9em;margin-left:2px}
.logo .s{font:600 15px Outfit;letter-spacing:.62em;margin-top:6px;padding-left:.62em}
.lt{color:#F3EDE3}.dk{color:#0D0E0C}
</style></head><body><div id="stage"></div>
<script>
const LOGO=c=>`<div class="logo ${c}"><div class="w">nogueira<sup>®</sup></div><div class="s">MÍDIAS</div></div>`;
const OR='#F08A1C', NO='#0D0E0C', CR='#F3EDE3';
const img=(n,fb)=>`<div class="fb" style="background:${fb}"></div><img class="ph" src="raw/${n}.png" onerror="this.remove()">`;
const SC=[
 [img('blob',`radial-gradient(circle at 50% 50%,#111 0 18%,${OR} 19%)`),'lt'],
 [img('camiseta',`linear-gradient(#2a2a2a,#111)`),'lt'],
 [`<div class="fb" style="background:${OR}"></div>
   <div style="position:absolute;left:0;right:0;bottom:0;height:640px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr">
    ${[['LIGHT','#F3EDE3','#0D0E0C'],['DEEP','#0D0E0C','#F3EDE3'],['DARK','#2A1C0B','#F3EDE3'],['WARM','#FFB43D','#0D0E0C']].map(([n,b,c])=>`<div style="background:${b};color:${c};padding:28px 32px;font:600 22px 'JetBrains Mono'">● ${n}<br><span style="font-weight:500;opacity:.7;font-size:18px;line-height:1.8">HEX ${b}</span></div>`).join('')}
   </div><div style="position:absolute;left:32px;top:40px;font:600 22px 'JetBrains Mono';color:${NO}">● PRIMARY · ${OR}</div>`,'lt'],
 [img('celular',`linear-gradient(#cfcfcf,#7a7a7a)`),'dk'],
 [img('hoodie',`linear-gradient(#2a2a2a,#111)`),'lt'],
 [`<div class="fb" style="background:linear-gradient(180deg,#0D0E0C 0%,${OR} 100%)"></div><div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.25)"></div><div style="position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(255,255,255,.25)"></div>`,'lt'],
 [img('bone',`linear-gradient(#3a2a1a,#1a120a)`),'lt'],
 [img('notebook',`linear-gradient(${OR},#a65a10)`),'lt'],
 [img('etiqueta',OR),'lt'],
 [img('copos',OR),'lt'],
 [img('silhueta',OR),'lt'],
 [img('painel',`linear-gradient(#2b2d31,#0f1012)`),'lt'],
 [`<div class="fb" style="background:linear-gradient(180deg,${OR},#c96a0c)"></div><div style="position:absolute;left:640px;top:50%;transform:translateY(-50%);font:700 64px Outfit;color:${CR}">Mídias</div>`,'lt'],
 [`<div class="fb" style="background:#0D0E0C"></div>
   <div style="position:absolute;left:-40px;right:-40px;top:880px;height:160px;display:flex;gap:22px;align-items:center">
    <div style="width:150px;height:150px;border-radius:40px;border:2px solid #3a3c40;display:flex;align-items:center;justify-content:center;color:${CR};font-size:56px">⌄</div>
    <div style="flex:1;height:150px;border-radius:40px;border:2px solid #3a3c40;background:#141517"></div>
   </div>
   <div style="position:absolute;left:60px;top:1110px;display:flex;gap:46px;font-size:64px;color:${CR};opacity:.8">← → ↻</div>`,'lt'],
 [img('sacola',`linear-gradient(#e6e6e6,#bdbdbd)`),'lt'],
 [img('garrafa',OR),'lt'],
];
const S=document.getElementById('stage');
SC.forEach(([html,c],i)=>{for(const neg of [0,1]){const d=document.createElement('div');d.className='sc';d.id=`s${i}_${neg}`;
  d.innerHTML=`<div class="${neg?'neg':''}" style="position:absolute;inset:0">${html}${LOGO(c)}</div>`;S.appendChild(d);}});
/* cortes medidos no original (quadros a 30fps) */
const CUTS=[];for(let f=2;f<=50;f+=2)CUTS.push(f);for(let f=53;f<=77;f+=3)CUTS.push(f);
[81,85,89,93,97,102,107,113,119,126,133,141,150,160,172,186,203,223].forEach(f=>CUTS.push(f));
const N=241;
let last=null;
window.setT=p=>{const f=Math.round(p*N); let k=0; while(k<CUTS.length&&f>=CUTS[k])k++;
 const sc=Math.floor(k/2)%SC.length, neg=k%2; const id=`s${sc}_${neg}`;
 if(id!==last){if(last)document.getElementById(last).style.display='none'; document.getElementById(id).style.display='block'; last=id;}};
window.setT(0);
</script></body></html>
