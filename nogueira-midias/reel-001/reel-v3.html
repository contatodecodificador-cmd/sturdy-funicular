<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<title>Reel 001 v3 · GRÃO RARO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800;9..144,900&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* v3: esqueleto de ritmo do @theplatterdotco (52 cortes, 241 quadros @30fps), visual reinventado em 5 fases. Sem legenda. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#v{position:absolute;inset:0;overflow:hidden}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.abs{position:absolute}
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;line-height:1;z-index:20}
.logo .w{font-family:Fraunces;font-weight:800;font-size:44px;letter-spacing:.06em}
.logo .s{font:600 13px Outfit;letter-spacing:.55em;padding-left:.55em;opacity:.9}
.ink{mix-blend-mode:multiply;opacity:.94}
.mono{font-family:"JetBrains Mono",monospace}
.fx{position:absolute;inset:0;pointer-events:none;z-index:50}
.grain{opacity:.10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.vign{background:radial-gradient(120% 85% at 50% 50%,transparent 60%,rgba(0,0,0,.35) 100%)}
</style></head><body><div id="v"><div id="cam"></div></div><div class="fx vign"></div><div class="fx grain"></div>
<script>
const C={cafe:'#2B1A12',creme:'#F1E6D6',cara:'#C8873A',folha:'#3E5B3A'};
const BEAN=(c,s=84,cr)=>`<svg width="${s}" height="${s*1.18}" viewBox="0 0 100 118"><ellipse cx="50" cy="59" rx="42" ry="55" fill="${c}" transform="rotate(-18 50 59)"/><path d="M42 8 C70 40 30 78 58 110" fill="none" stroke="${cr||(c===C.creme?C.cafe:C.creme)}" stroke-width="7" stroke-linecap="round" transform="rotate(-18 50 59)"/></svg>`;
const LOGO=(c,ink)=>`<div class="logo ${ink?'ink':''}" style="color:${c}">${BEAN(c,60)}<div class="w">GRÃO RARO</div><div class="s">TORRA ARTESANAL</div></div>`;
const P={grao3d:[.5,.47,C.creme],camiseta:[.5,.47,C.creme],celular:[.52,.47,C.cafe],moletom:[.5,.54,C.creme],bone:[.5,.58,C.cafe],pacote:[.5,.60,C.creme],
 copos:[.5,.52,C.cafe],silhueta:[.36,.62,C.creme],letreiro:[.47,.47,C.cafe],xicara:[.55,.56,C.cafe],coldbrew:[.5,.57,C.cafe],sacola:[.5,.60,C.cafe]};
const ORD=['grao3d','bone','copos','pacote','moletom','xicara','celular','sacola','coldbrew','letreiro','camiseta','silhueta'];
const photo=(n,z=1)=>{const [x,y]=P[n];return `<img class="cover" src="raw/${n}.png" style="transform:scale(${1.12*z}) translate(${(.5-x)*100/1.12}%,${(.5-y)*100/1.12}%)">`};
const hero=(n,z)=>photo(n,z)+LOGO(P[n][2],P[n][2]===C.cafe);
const DUO=[[C.cafe,C.creme],[C.cara,C.cafe],[C.folha,C.creme],[C.creme,C.cafe],[C.cafe,C.cara]];
const beanMask=`url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 118'><ellipse cx='50' cy='59' rx='42' ry='55' fill='black' transform='rotate(-18 50 59)'/></svg>")`;
const ease=x=>1-Math.pow(1-x,3), cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));

function plane(k,q){
 // FASE A — relâmpago: produto ↔ grão gigante
 if(k<=24){ const n=ORD[Math.floor(k/2)%ORD.length];
   if(k%2===0) return hero(n,1);
   const [bg,fg]=DUO[Math.floor(k/2)%DUO.length];
   return `<div class="abs" style="inset:0;background:${bg}"></div><div class="abs" style="left:50%;top:50%;transform:translate(-50%,-50%) rotate(${(k*23)%40-20}deg)">${BEAN(fg,1150,bg)}</div>`; }
 // FASE B — janela: produto dentro do grão gigante
 if(k<=33){ const W=[['xicara',C.cafe,C.creme],['copos',C.folha,C.creme],['camiseta',C.cara,C.cafe],['grao3d',C.creme,C.cafe],['bone',C.cafe,C.creme],['pacote',C.cara,C.cafe],['sacola',C.creme,C.cafe],['coldbrew',C.cara,C.cafe],['letreiro',C.creme,C.cafe]][k-25];
   const n=W[0], bg=W[1], fg=W[2], rot=-25+((k-25)*9);
   return `<div class="abs" style="inset:0;background:${bg}"></div>
    <div class="abs" style="left:50%;top:46%;width:780px;height:1020px;transform:translate(-50%,-50%) rotate(${rot}deg);clip-path:ellipse(50% 50% at 50% 50%);box-shadow:0 0 0 1px transparent">
      <div class="abs" style="inset:-260px;transform:rotate(${-rot}deg)">${photo(n,1)}</div></div>
    <svg class="abs" style="left:50%;top:46%;width:780px;height:1020px;transform:translate(-50%,-50%) rotate(${rot}deg);overflow:visible" viewBox="0 0 100 118"><path d="M44 4 C72 38 28 80 56 114" fill="none" stroke="${bg}" stroke-width="5" stroke-linecap="round"/></svg>
    <div class="abs" style="left:0;right:0;top:1640px;text-align:center;color:${fg};font:800 64px Fraunces;letter-spacing:.08em">GRÃO RARO</div>`; }
 // FASE C — manual da marca
 if(k<=41){ const t=k-34, s=ease(cl(q/0.5));
   if(t%4===0){ const cells=Array.from({length:12},(_,i)=>i===4||i===7?null:ORD[(i+t)%12]);
     return `<div class="abs" style="inset:0;background:${C.creme};display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:10px;padding:10px">
       ${cells.map((n,i)=>n?`<div style="position:relative;overflow:hidden;border-radius:14px;opacity:${cl(s*1.6-i*0.08)};transform:translateY(${(1-cl(s*1.6-i*0.08))*40}px)">${photo(n,1)}</div>`:(i===4?`<div style="grid-row:span 2;background:${C.cara};border-radius:14px;position:relative">${LOGO(C.cafe)}</div>`:'')).join('')}</div>`; }
   if(t%4===1){ const a=ORD[(t*2)%12], b=ORD[(t*2+5)%12];
     return `<div class="abs" style="left:0;right:0;top:0;height:960px;overflow:hidden;transform:translateX(${(1-s)*-120}px)">${photo(a,1)}</div>
       <div class="abs" style="left:0;right:0;bottom:0;height:960px;overflow:hidden;transform:translateX(${(1-s)*120}px)">${photo(b,1)}</div>
       <div class="abs" style="left:0;right:0;top:880px;height:160px;background:${C.cafe}"></div>${LOGO(C.creme)}`; }
   if(t%4===2){ return `<div class="abs" style="inset:0;background:${C.cafe}"></div>
       <div class="abs" style="left:70px;top:230px;color:${C.creme};font:900 520px/0.9 Fraunces;transform:translateY(${(1-s)*60}px)">Aa</div>
       <div class="abs mono" style="left:80px;top:780px;color:${C.cara};font-size:30px;font-weight:600">FRAUNCES 800 · OUTFIT 600</div>
       <div class="abs" style="left:80px;right:80px;top:880px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
        ${[C.cafe,C.creme,C.cara,C.folha].map((c,i)=>`<div style="height:${300*cl(s*1.5-i*0.12)}px;background:${c};border:2px solid #4a3326;border-radius:18px"></div>`).join('')}</div>
       <div class="abs" style="left:80px;top:1260px">${BEAN(C.creme,120)}</div>
       <div class="abs" style="left:230px;top:1290px;color:${C.creme};font:800 72px Fraunces;letter-spacing:.06em">GRÃO RARO</div>`; }
   const n=ORD[(t+7)%12];
   return `<div class="abs" style="inset:0;background:${C.folha}"></div>
     <div class="abs" style="inset:-80px;opacity:.16;display:grid;grid-template-columns:repeat(6,1fr);gap:40px;transform:rotate(-12deg) translateY(${q*-60}px)">${Array.from({length:66},()=>BEAN(C.creme,90)).join('')}</div>
     <div class="abs" style="left:140px;top:300px;width:800px;height:1320px;border-radius:30px;overflow:hidden;box-shadow:0 50px 100px rgba(0,0,0,.45);transform:scale(${0.9+0.1*s})">${hero(n,1)}</div>`; }
 // FASE D — heróis desacelerando
 if(k<=50){ const n=['bone','pacote','xicara','copos','sacola','coldbrew','letreiro','moletom','celular'][k-42]; return hero(n,1+0.06*q); }
 // FASE E — final
 if(k===51){ const s=ease(cl(q/0.35));
   return `<div class="abs" style="inset:0;background:${C.cafe}"></div>
    <div class="abs" style="left:50%;top:38%;transform:translate(-50%,-50%) scale(${0.4+0.6*s}) rotate(${(1-s)*-30}deg)">${BEAN(C.cara,300,C.cafe)}</div>
    <div class="abs" style="left:0;right:0;top:1080px;text-align:center;color:${C.creme};font:900 168px/0.9 Fraunces;transform:translateY(${(1-s)*80}px);opacity:${s}">GRÃO<br>RARO</div>
    <div class="abs" style="left:0;right:0;top:1440px;text-align:center;color:${C.cara};font:600 26px Outfit;letter-spacing:.6em;opacity:${cl((q-0.4)/0.3)}">TORRA ARTESANAL</div>`; }
 return `<div class="abs" style="inset:0;background:radial-gradient(80% 60% at 50% 50%,#d4964a,${C.cara} 45%,#9d6427 100%)"></div>${LOGO(C.cafe)}`;
}
const CUTS=[];for(let f=2;f<=50;f+=2)CUTS.push(f);for(let f=53;f<=77;f+=3)CUTS.push(f);
[81,85,89,93,97,102,107,113,119,126,133,141,150,160,172,186,203,223].forEach(f=>CUTS.push(f));
const N=241, cam=document.getElementById('cam');
ORD.forEach(n=>{const i=new Image();i.src=`raw/${n}.png`;});
window.setT=p=>{const f=Math.round(p*N); let k=0; while(k<CUTS.length&&f>=CUTS[k])k++;
 const a=k?CUTS[k-1]:0, b=k<CUTS.length?CUTS[k]:N, q=(f-a)/Math.max(1,b-a);
 cam.innerHTML=plane(k,q);
 const punch=(k>=34&&k<=50)?(1.07-0.07*ease(cl((f-a)/3))):1;
 cam.style.transform=`scale(${punch})`;};
window.setT(0);
</script></body></html>
