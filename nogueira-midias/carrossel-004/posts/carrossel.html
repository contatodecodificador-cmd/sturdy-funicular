<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>LUMI Odontologia · 9 posts do feed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* 9 posts 1080x1350 lado a lado (9720x1350) — sistema visual da marca fictícia LUMI Odontologia */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:9720px;height:1350px;overflow:hidden;background:#000}
:root{--prof:#0B2A4A;--azul:#1F6FEB;--menta:#7FE3C8;--gelo:#F2F7FA;--graf:#1B2430}
#stage{position:relative;width:9720px;height:1350px;font-family:Outfit,sans-serif}
.p{position:absolute;top:0;width:1080px;height:1350px;overflow:hidden}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.h{font-family:Sora;letter-spacing:-.03em;line-height:1}
.h .l{font-weight:300}.h .b{font-weight:700}
.logo{position:absolute;top:64px;left:64px;display:flex;align-items:center;gap:14px;z-index:5}
.logo .m{width:52px;height:52px;border-radius:16px;background:var(--menta);display:flex;align-items:center;justify-content:center}
.logo .w{font:800 40px Sora;letter-spacing:-.04em;line-height:1}
.logo .s{font:600 11px Outfit;letter-spacing:.42em;margin-top:4px;opacity:.75}
.ft{position:absolute;left:64px;right:64px;bottom:56px;display:flex;justify-content:space-between;align-items:center;font:500 22px Outfit;z-index:5}
.ft .go{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px}
.dk{color:var(--gelo)} .dk .ft .go{background:var(--menta);color:var(--prof)}
.lt{color:var(--prof)} .lt .ft .go{background:var(--prof);color:var(--gelo)}
.lt{background:var(--gelo)}
.chip{display:inline-block;font:600 20px Outfit;letter-spacing:.14em;padding:8px 18px;border-radius:999px}
.fallback{position:absolute;inset:0;background:linear-gradient(160deg,#cfe6f5,#7FE3C8)}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,S=document.getElementById('stage');
const smile=c=>`<svg width="30" height="30" viewBox="0 0 30 30"><path d="M6 12c2 7 16 7 18 0" fill="none" stroke="${c}" stroke-width="4.2" stroke-linecap="round"/><circle cx="10" cy="7" r="2.4" fill="${c}"/><circle cx="20" cy="7" r="2.4" fill="${c}"/></svg>`;
const logo=(dark=true)=>`<div class="logo"><div class="m">${smile('#0B2A4A')}</div><div><div class="w">lumi</div><div class="s">ODONTOLOGIA</div></div></div>`;
const ft=`<div class="ft"><span>@lumi.odonto</span><span class="go">→</span></div>`;
const img=(n,st='')=>`<div class="fallback"></div><img class="ph" src="../raw/${n}.png" style="${st}" onerror="this.remove()">`;
function post(i,cls,html){const d=document.createElement('section');d.className='p '+cls;d.style.left=(i*W)+'px';d.innerHTML=html;S.appendChild(d)}

/* 1 — sorriso */
post(0,'lt',`${img('sorriso')}<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(242,247,250,.85),rgba(242,247,250,0) 38%)"></div>${logo()}
 <p class="h" style="position:absolute;left:64px;top:190px;font-size:118px"><span class="l">Seu sorriso,</span><br><span class="b" style="color:var(--azul)">sem medo.</span></p>${ft}`);

/* 2 — dica */
post(1,'lt',`${logo()}
 <p class="h" style="position:absolute;left:64px;right:64px;top:220px;font-size:104px"><span class="b">3 hábitos</span><br><span class="l">que mancham<br>seus dentes</span></p>
 <div style="position:absolute;left:64px;right:64px;top:720px;display:flex;flex-direction:column;gap:26px">
  ${['Café sem um gole de água depois','Escovar com pressa (menos de 2 min)','Pular o fio dental'].map((t,i)=>`<div style="display:flex;align-items:center;gap:26px;font:500 38px Outfit"><span style="flex:none;width:72px;height:72px;border-radius:22px;background:var(--menta);display:flex;align-items:center;justify-content:center;font:700 34px Sora">${i+1}</span>${t}</div>`).join('')}
 </div>${ft}`);

/* 3 — dente de cristal */
post(2,'dk',`<div style="position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 50%,#13406e,var(--prof) 70%)"></div><img src="../raw/dente.png" onerror="this.remove()" style="position:absolute;left:90px;top:300px;width:900px;height:900px;object-fit:cover;mix-blend-mode:normal">${logo()}
 <p class="h" style="position:absolute;left:64px;right:64px;top:190px;font-size:76px"><span class="l">Prevenir é a forma</span><br><span class="b" style="color:var(--menta)">mais bonita de cuidar.</span></p>${ft}`);

/* 4 — agenda aberta */
post(3,'',`<div style="position:absolute;inset:0;background:var(--menta)"></div><div style="color:var(--prof)">${logo()}
 <span class="chip" style="position:absolute;left:64px;top:200px;background:var(--prof);color:var(--gelo)">DEZEMBRO</span>
 <p class="h" style="position:absolute;left:64px;top:270px;font-size:140px"><span class="b">Agenda</span><br><span class="l">aberta.</span></p>
 <div style="position:absolute;left:64px;right:64px;top:640px;background:rgba(255,255,255,.55);border-radius:30px;padding:30px;display:grid;grid-template-columns:repeat(7,1fr);gap:12px;text-align:center;font:600 26px Outfit">
  ${['D','S','T','Q','Q','S','S'].map(d=>`<span style="opacity:.5;font-size:20px">${d}</span>`).join('')}
  ${Array.from({length:28},(_,k)=>{const d=k+1,f=[2,4,9,11,16,18,23].includes(d);return `<span style="padding:10px 0;border-radius:14px;${f?'background:var(--prof);color:var(--gelo)':''}">${d}</span>`}).join('')}
 </div>
 <div class="ft" style="color:var(--prof)"><span>Agende pelo link da bio</span><span class="go" style="background:var(--prof);color:var(--gelo)">→</span></div></div>`);

/* 5 — consultório */
post(4,'dk',`${img('consultorio')}<div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,42,74,.9),rgba(11,42,74,0) 50%)"></div>${logo()}
 <p class="h" style="position:absolute;left:64px;right:64px;bottom:170px;font-size:84px"><span class="l">Um consultório que</span><br><span class="b" style="color:var(--menta)">não parece consultório.</span></p>${ft}`);

/* 6 — depoimento */
post(5,'lt',`${logo()}
 <p style="position:absolute;left:52px;top:200px;font:700 300px/1 Sora;color:var(--menta)">“</p>
 <p class="h" style="position:absolute;left:64px;right:64px;top:440px;font-size:80px;line-height:1.08"><span class="l">Pela primeira vez saí do dentista</span> <span class="b" style="color:var(--azul)">sem medo.</span></p>
 <div style="position:absolute;left:64px;top:880px;display:flex;align-items:center;gap:20px">
  <div style="width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--menta),var(--azul))"></div>
  <div><p style="font:700 32px Outfit">Carla M.</p><p style="font:500 26px Outfit;color:#E0A100">★★★★★</p></div>
 </div>${ft}`);

/* 7 — escova surreal */
post(6,'dk',`${img('escova')}<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,42,74,.75),rgba(11,42,74,0) 40%)"></div>${logo()}
 <p class="h" style="position:absolute;left:64px;right:64px;top:190px;font-size:84px"><span class="l">Cuidado diário,</span><br><span class="b" style="color:var(--menta)">sorriso pra vida toda.</span></p>${ft}`);

/* 8 — avaliação sem custo */
post(7,'dk',`<div style="position:absolute;inset:0;background:var(--azul)"></div>${logo()}
 <span class="chip" style="position:absolute;left:64px;top:210px;background:var(--menta);color:var(--prof)">PRIMEIRA CONSULTA</span>
 <p class="h" style="position:absolute;left:64px;top:290px;font-size:150px"><span class="b">Avaliação</span><br><span class="l">sem custo.</span></p>
 <img src="../assets/dente_cut.png" onerror="this.remove()" style="position:absolute;right:-40px;bottom:150px;width:560px;filter:drop-shadow(0 40px 50px rgba(0,0,0,.35))">
 <p style="position:absolute;left:64px;top:690px;width:470px;font:500 32px/1.35 Outfit;opacity:.9">Raio-x, limpeza e um plano de tratamento claro, sem surpresa no orçamento.</p>${ft}`);

/* 9 — pergunta (versão estática do vídeo de digitação) */
post(8,'lt',`${logo()}
 <p class="h" style="position:absolute;left:64px;right:64px;top:380px;font-size:88px;line-height:1.08;color:var(--azul)"><span class="l">Quando foi a última vez que você sorriu numa foto</span> <span class="b" style="background:var(--azul);color:var(--gelo);padding:0 12px;border-radius:10px">sem pensar</span> <span class="b">nos dentes?</span></p>${ft}`);
</script></body></html>
