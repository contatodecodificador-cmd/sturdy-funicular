<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Nogueira Mídias · Carrossel 004 · Planejei o Instagram de uma marca do zero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;600;700;800&display=swap">
<link rel="stylesheet" href="../brand/tokens.css">
<style>
/* 6 slides (6480x1350): 1 capa com celular · 2 grade · 3 [vídeo digitação] · 4 grade · 5 [vídeo dente] · 6 CTA */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:6480px;height:1350px;background:#000;overflow:hidden}
#stage{position:relative;width:6480px;height:1350px;font-family:var(--f-ui);color:var(--creme)}
.slide{position:absolute;top:0;width:1080px;height:1350px;overflow:hidden}
.dark{background:radial-gradient(70% 38% at 50% 16%,#2a1d0e 0%,#16120d 40%,var(--noite) 75%)}
.bar{position:absolute;top:34px;left:44px;right:44px;display:flex;justify-content:space-between;align-items:center;font-size:24px;opacity:.95;z-index:60}
.bar .m b{font-weight:700}.bar .x,.bar .min{font-size:30px;font-weight:300}
.cnt{position:absolute;top:96px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:20px;border:1.5px solid currentColor;border-radius:999px;padding:3px 16px;opacity:.6;z-index:60}
.it{font-family:var(--f-serif);font-style:italic;color:var(--laranja)}
.disp{font-family:var(--f-display);text-transform:uppercase;line-height:.86}
.grain{position:absolute;inset:0;pointer-events:none;z-index:55;opacity:.12;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.vign{position:absolute;inset:0;pointer-events:none;z-index:54;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%)}
.pill{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);font:600 19px var(--f-mono);letter-spacing:.06em;color:var(--creme);background:rgba(13,14,12,.6);backdrop-filter:blur(6px);border:1.5px solid rgba(240,138,28,.85);border-radius:999px;padding:8px 20px;white-space:nowrap;z-index:60}
.pill b{color:var(--laranja)}
/* celular */
.phone{position:absolute;left:272px;top:130px;width:536px;height:1080px;border-radius:78px;background:#0a0c10;padding:16px;box-shadow:0 60px 120px rgba(0,0,0,.6),0 0 0 3px #2a2f38,inset 0 0 0 2px #3a414d}
.screen{position:relative;width:100%;height:100%;border-radius:64px;overflow:hidden;background:#fff;color:#111;font-family:Outfit}
.notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:150px;height:40px;border-radius:22px;background:#0a0c10;z-index:3}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid div{aspect-ratio:4/5;overflow:hidden;background:#ddd}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.g2{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;background:#0B2A4A}
.g2 img{width:100%;height:100%;object-fit:cover;display:block}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,S=document.getElementById('stage');
const bar=n=>`<div class="bar"><span class="min">—</span><span class="m">@nogueira_midias | <b>Nogueira Mídias</b></span><span class="x">✕</span></div>`+(n?`<div class="cnt">${n}</div>`:'');
const fx=`<div class="vign"></div><div class="grain"></div>`;
const P=n=>`posts/out/slide-0${n}.png`;
function slide(i,cls,html){const d=document.createElement('section');d.className='slide '+cls;d.style.left=(i*W)+'px';d.innerHTML=html;S.appendChild(d)}
const smile=`<svg width="40" height="40" viewBox="0 0 30 30"><path d="M6 12c2 7 16 7 18 0" fill="none" stroke="#0B2A4A" stroke-width="4.2" stroke-linecap="round"/><circle cx="10" cy="7" r="2.4" fill="#0B2A4A"/><circle cx="20" cy="7" r="2.4" fill="#0B2A4A"/></svg>`;

/* 1 — CAPA: celular com o perfil */
slide(0,'',`<div style="position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 45%,#1F6FEB 0%,#0B2A4A 70%)"></div>
 <img src="raw/perfil.png" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(18px) brightness(.8)">
 ${bar()}
 <div class="phone"><div class="screen"><div class="notch"></div>
  <div style="padding:72px 26px 0">
   <div style="display:flex;justify-content:space-between;align-items:center;font:700 26px Outfit"><span>← lumi.odonto</span><span style="font-size:30px">☰</span></div>
   <div style="display:flex;align-items:center;gap:26px;margin-top:22px">
    <div style="width:120px;height:120px;border-radius:50%;padding:5px;background:linear-gradient(135deg,#7FE3C8,#1F6FEB)"><div style="width:100%;height:100%;border-radius:50%;background:#7FE3C8;border:4px solid #fff;display:flex;align-items:center;justify-content:center">${smile}</div></div>
    <div style="display:flex;gap:28px;text-align:center;font:500 18px Outfit">${[['9','posts'],['2.418','seguidores'],['312','seguindo']].map(([a,b])=>`<div><b style="font:700 26px Outfit;display:block">${a}</b>${b}</div>`).join('')}</div>
   </div>
   <p style="font:700 20px Outfit;margin-top:16px">LUMI Odontologia</p>
   <p style="font:400 18px/1.35 Outfit;color:#333">Sorrir sem pensar duas vezes 🦷<br>Clínica odontológica · avaliação sem custo<br><span style="color:#1F6FEB">agende pelo link ↓</span></p>
   <div style="display:flex;gap:10px;margin-top:16px">${['Seguir','Mensagem','Contato'].map((t,i)=>`<div style="flex:1;text-align:center;font:600 18px Outfit;padding:10px 0;border-radius:10px;${i?'background:#eef1f4':'background:#1F6FEB;color:#fff'}">${t}</div>`).join('')}</div>
   <div style="display:flex;justify-content:space-around;margin:18px -26px 0;padding:12px 0;border-top:1px solid #eee;font-size:24px;color:#999"><span style="color:#111;border-bottom:2px solid #111;padding-bottom:8px">▦</span><span>▷</span><span>☺</span></div>
  </div>
  <div class="grid" style="margin-top:2px">${[9,8,7,6,5,4,3,2,1].map(n=>`<div><img src="${P(n)}"></div>`).join('')}</div>
 </div></div>
 <div class="pill"><b>#004</b> · planejei o Instagram de uma marca do zero</div>${fx}`);

/* 2 — grade 1 */
slide(1,'',`<div class="g2">${[1,2,3,4].map(n=>`<img src="${P(n)}">`).join('')}</div><div class="cnt" style="color:#fff;top:20px">02 / 06</div>`);
/* 3 — (vídeo de digitação) quadro estático */
slide(2,'',`<img src="out/typing.png" onerror="this.remove()" style="width:100%;height:100%">`);
/* 4 — grade 2 */
slide(3,'',`<div class="g2">${[5,6,7,8].map(n=>`<img src="${P(n)}">`).join('')}</div><div class="cnt" style="color:#fff;top:20px">04 / 06</div>`);
/* 5 — (vídeo do dente) quadro estático */
slide(4,'',`<img src="out/dente.png" onerror="this.remove()" style="width:100%;height:100%">`);

/* 6 — CTA */
slide(5,'dark',`${bar('06 / 06')}
 <div style="position:absolute;top:170px;left:0;right:0;text-align:center">
  <p class="disp" style="font-size:118px;color:var(--creme)">Quer o Instagram</p>
  <p class="it" style="font-size:104px;line-height:1">da sua marca assim?</p>
 </div>
 <div style="position:absolute;left:80px;top:440px;width:920px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px">
  ${[1,3,4,8].map((n,i)=>`<div style="aspect-ratio:4/5;border-radius:10px;overflow:hidden;box-shadow:0 20px 30px rgba(0,0,0,.5);transform:rotate(${[-3,2,-2,3][i]}deg)"><img src="${P(n)}" style="width:100%;height:100%;object-fit:cover"></div>`).join('')}
 </div>
 <div style="position:absolute;left:0;right:0;top:800px;text-align:center">
  <div style="display:inline-flex;align-items:center;gap:12px;background:var(--creme);color:var(--noite);font-size:32px;font-weight:700;padding:16px 34px;border-radius:999px">➤ me chama no direct</div>
  <div style="display:flex;align-items:center;justify-content:center;gap:22px;margin-top:56px">
   <svg width="62" height="80" viewBox="0 0 92 120"><path d="M8 6h76v108L46 88 8 114z" fill="none" stroke="#FFB43D" stroke-width="10" stroke-linejoin="round"/></svg>
   <p class="disp" style="font-size:130px;background:linear-gradient(180deg,var(--ambar),var(--laranja));-webkit-background-clip:text;background-clip:text;color:transparent">Salva</p>
  </div>
  <p style="font-size:30px;color:rgba(243,237,227,.8);margin-top:6px">e manda pro <b style="color:var(--creme)">dentista que você mais confia.</b></p>
 </div>
 <p style="position:absolute;left:0;right:0;bottom:50px;text-align:center;font-family:var(--f-mono);font-size:18px;letter-spacing:.06em;color:rgba(243,237,227,.45)">LUMI é uma marca fictícia, criada para portfólio.</p>${fx}`);
</script></body></html>
