<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,200..900&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Capa animada BRUTO: "burger" gigante passando atrás da mão com o burger. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(2px) brightness(.75) saturate(1.05)}
.band{position:absolute;left:-500px;top:250px;width:4000px;transform:rotate(-9deg);white-space:nowrap;font-family:"Archivo",sans-serif;font-size:290px;line-height:1;color:#F3E9D6;text-transform:lowercase;text-shadow:0 10px 40px rgba(0,0,0,.35)}
.band span{display:inline-block;padding-right:70px}
.band .b{font-weight:900;font-stretch:112%}
.band .l{font-weight:200;font-stretch:100%;font-style:italic;color:#F2B705}
.fg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.5))}
.bar{position:absolute;top:34px;left:44px;right:44px;display:flex;justify-content:space-between;align-items:center;font:400 24px Outfit;color:#F3EDE3;opacity:.9;z-index:9}
.bar b{font-weight:700}.bar .x,.bar .min{font-size:30px;font-weight:300}
.logo{position:absolute;top:100px;left:0;right:0;display:flex;flex-direction:column;align-items:center;color:#F3E9D6;z-index:9}
.logo .w{font-family:"Archivo";font-weight:900;font-stretch:125%;font-size:64px;letter-spacing:.02em;line-height:1}
.logo .s{font:600 14px Outfit;letter-spacing:.5em;margin-top:6px;padding-left:.5em;color:#F2B705}
.pill{position:absolute;bottom:118px;left:50%;transform:translateX(-50%);font:600 18px "JetBrains Mono";letter-spacing:.08em;color:#F3EDE3;background:rgba(13,14,12,.55);backdrop-filter:blur(6px);border:1.5px solid rgba(240,138,28,.8);border-radius:999px;padding:7px 18px;white-space:nowrap;z-index:9}
.pill b{color:#F08A1C}
.desc{position:absolute;bottom:62px;left:0;right:0;text-align:center;font:500 18px "JetBrains Mono";letter-spacing:.32em;color:#F3E9D6;opacity:.85;z-index:9}
.grain{position:absolute;inset:0;opacity:.12;mix-blend-mode:overlay;z-index:10;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.vign{position:absolute;inset:0;z-index:8;background:radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
</style></head><body>
<img class="bg" src="assets/capa_bg.jpg">
<div class="bar"><span class="min">—</span><span>@nogueira_midias | <b>Nogueira Mídias</b></span><span class="x">✕</span></div>
<div class="logo"><div class="w">BRUTO</div><div class="s">SMASH BURGER</div></div>
<div class="band" id="band"></div>
<img class="fg" src="assets/capa_fg.png">
<div class="vign"></div>
<div class="pill"><b>#003</b> · se fosse meu cliente: hamburgueria</div>
<div class="desc">ARRASTA PRO LADO →</div>
<div class="grain"></div>
<script>
const band=document.getElementById('band');
band.innerHTML=Array.from({length:8},(_,i)=>`<span class="${i%2?'l':'b'}">burger</span>`).join('');
let unit=0;
window.setT=p=>{if(!unit){const s=band.children;unit=s[2].offsetLeft-s[0].offsetLeft;} band.style.transform=`rotate(-9deg) translateX(${-p*unit}px)`;};
window.setT(0);
</script></body></html>
