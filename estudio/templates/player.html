<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>player</title>
<style>
@font-face{font-family:'Titulo';src:url(../node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Mono';font-weight:500;src:url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Mono';font-weight:800;src:url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Texto';font-weight:500;src:url(../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Texto';font-weight:800;src:url(../node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2) format('woff2')}

/* Radar Público News, linha "jornal claro": papel creme, tinta preta/grafite e amarelo marca-texto. Sem azul. Vermelho só como perigo no mapa. */
:root{--ink:#141414;--hl:#ffd400;--danger:#e0343f;--paper:#efe9dc}
body.jornal{--bg:#efe9dc;--mun:#e2dccd;--munL:#bdb5a3;--estL:#141414;--fora:#e8e2d3;--foraL:#d3ccba;--sombraDest:#6b6452;--grade:#14141409}
body.grafite{--bg:#171717;--mun:#262626;--munL:#444;--estL:#d8d8d8;--fora:#101010;--foraL:#2a2a2a;--sombraDest:#000;--grade:#ffffff0a}
body.sat{--bg:#121212;--grade:#0000}
html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:var(--bg)}
#palco{position:relative;width:720px;height:1280px;overflow:hidden;background:var(--bg)}
#mundo{position:absolute;inset:0;perspective:1100px;perspective-origin:360px 600px}
#plano{position:absolute;left:0;top:0;width:720px;height:1280px;transform-origin:360px 600px}
/* colunas de jornal bem discretas (inclinam junto com o mapa) */
#grade{position:absolute;left:-540px;top:-1150px;width:1800px;height:2600px;background-image:linear-gradient(90deg,var(--grade) 1px,transparent 1px);background-size:120px 100%}
svg#mapa{position:absolute;left:-540px;top:-1150px;overflow:visible}
#horizonte{position:absolute;left:0;right:0;top:0;height:430px;pointer-events:none;background:linear-gradient(to bottom,var(--bg) 0%,var(--bg) 18%,transparent 100%)}
/* grão de papel */
#grao{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .30  0 0 0 0 .22  0 0 0 .22 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
body.sat #grao,body.grafite #grao{display:none}
#vinheta{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 62%,#6a5c3c30 100%)}
body.grafite #vinheta{background:radial-gradient(ellipse at 50% 50%,transparent 52%,#00000066 100%)}
.mun{fill:var(--mun);stroke:var(--munL);stroke-width:.55;vector-effect:non-scaling-stroke}
.est{fill:none;stroke:var(--estL);stroke-width:1.1;vector-effect:non-scaling-stroke;stroke-opacity:.9}
.est.fora{fill:var(--fora);stroke:var(--foraL);stroke-width:.8;stroke-opacity:.8}
.dest path{stroke:#141414;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.anc{fill:#0000;stroke:none}
#rota{fill:none;stroke:var(--hl);stroke-width:3.2;vector-effect:non-scaling-stroke;stroke-linecap:round;filter:drop-shadow(0 0 1px #141414) drop-shadow(0 0 1px #141414)}
#gSat{display:none}
body.sat #gSat{display:block}
body.sat .mun{fill:transparent;stroke:#ffffff;stroke-opacity:.26;stroke-width:.5}
body.sat .est{stroke:#fff;stroke-opacity:.95;stroke-width:1.6}
body.sat .est.fora{fill:none;stroke:#fff;stroke-opacity:.45;stroke-width:.9}
body.sat #grade{display:none}
body.sat #horizonte{height:300px}
body.sat #vinheta{background:radial-gradient(ellipse at 50% 50%,transparent 45%,#000000a0 100%)}

.ov{position:absolute}
#tag{left:22px;top:22px;font:800 12px Mono;letter-spacing:.06em;color:var(--ink);background:var(--hl);padding:5px 10px 5px 9px;border:1.5px solid var(--ink);text-transform:uppercase;white-space:nowrap;box-shadow:3px 3px 0 var(--ink)}
#tag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:7px;vertical-align:1px}
#titulo{left:0;right:0;top:62px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0}
#titulo .box{background:#fffdf7;padding:10px 24px 12px;text-align:center;box-shadow:5px 5px 0 var(--ink);border:2px solid var(--ink);max-width:650px;position:relative}
#titulo .l1{display:inline-block;font:84px/1.04 Titulo;color:var(--ink);letter-spacing:.01em;background:var(--hl);padding:0 14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#titulo .l1 small{font-size:42px;margin-left:4px}
#titulo .l1.longo{font-size:58px}
#titulo .l1.txt{font-size:60px;line-height:1.12;text-transform:uppercase}
#titulo .l2{font:32px/1.1 Titulo;color:var(--ink);margin-top:6px;text-transform:uppercase;letter-spacing:.02em}
#titulo .sub{margin-top:10px;background:var(--hl);color:var(--ink);font:800 12px Mono;letter-spacing:.06em;padding:4px 10px;border:1.5px solid var(--ink);text-transform:uppercase;box-shadow:2px 2px 0 var(--ink)}
#titulo svg.circ{position:absolute;left:-14px;top:-10px;width:calc(100% + 28px);height:calc(100% + 20px);overflow:visible}
#titulo svg.circ path{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}

#rotulos .pin{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--hl);border:2px solid var(--ink);box-shadow:0 2px 6px #0008}
#rotulos .rot{position:absolute;background:#fff;border:1.5px solid var(--ink);color:var(--ink);padding:6px 10px 7px;box-shadow:3px 3px 0 #141414cc;white-space:nowrap;transform-origin:0 100%}
.rot b{display:block;font:800 15px Mono;letter-spacing:.02em;text-transform:uppercase}
.rot span{display:block;font:500 11px Mono;color:#5b5446;margin-top:2px;text-transform:uppercase}

.nota{position:absolute;width:196px;min-height:120px;background:var(--hl);padding:16px 14px 14px;box-shadow:0 12px 24px #0006;box-sizing:border-box}
.nota:before{content:'';position:absolute;left:50%;top:-6px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ink);box-shadow:0 2px 3px #0006}
.nota .topo{font:800 11px Mono;color:#4a3d00;text-transform:uppercase;letter-spacing:.04em}
.nota .tx{font:36px/1.02 Titulo;color:var(--ink);margin-top:8px;text-transform:uppercase}

.nt{position:absolute;width:560px;background:#fff;overflow:hidden;box-shadow:0 26px 50px #0008,0 4px 0 #0003;box-sizing:border-box;color:var(--ink);border:1.5px solid #cfc8b6}
.nt .bar{display:flex;align-items:center;gap:6px;background:#e7e3d8;padding:9px 12px}
.nt .bar i{width:10px;height:10px;border-radius:50%;background:#bdb5a3}
.nt .bar .url{margin-left:8px;flex:1;background:#fff;border-radius:12px;padding:4px 12px;font:500 12px Mono;color:#4a4a4a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt .img{height:210px;background:#ccc center/cover}
.nt .corpo{padding:16px 22px 20px}
.nt .veic{display:inline-block;background:var(--ink);color:var(--hl);font:800 13px Mono;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px}
.nt .manc{font:40px/1.05 Titulo;margin-top:12px;color:var(--ink)}
.nt .dt{font:500 13px Mono;color:#6a6658;margin-top:12px}
.pol{position:absolute;width:300px;background:#fffdf7;padding:12px 12px 14px;box-sizing:border-box;box-shadow:0 22px 40px #0009}
.pol .im{position:relative;width:276px;height:276px;background:#141414;overflow:hidden}
.pol .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pol .rec{position:absolute;left:8px;top:8px;background:#000a;color:#fff;font:800 10px Mono;padding:3px 7px;border-radius:3px;letter-spacing:.06em}
.pol .rec:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-right:5px}
.pol .play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:#000a;border:3px solid #fff}
.pol .play:after{content:'';position:absolute;left:25px;top:16px;border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent}
.pol .cr{font:500 12px/1.2 Mono;color:#3a3a3a;margin-top:10px;text-align:center}

#painel{position:absolute;inset:0;background:var(--bg);background-image:linear-gradient(90deg,#14141409 1px,transparent 1px);background-size:120px 100%}
.item{position:absolute;width:290px;min-height:150px;background:var(--hl);padding:14px 18px;box-sizing:border-box;box-shadow:0 12px 24px #0006}
.item:before{content:'';position:absolute;left:50%;top:-6px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--ink)}
.item .n{font:58px Titulo;color:var(--ink)}
.item .t{font:500 24px/1.15 Texto;font-style:italic;color:#2a2400;margin-top:4px}
.item svg{position:absolute;right:14px;top:10px;width:70px;height:50px}
.item svg path{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
#ctaCard{position:absolute;left:90px;width:540px;top:400px;background:#fffdf7;padding:22px 26px 26px;box-sizing:border-box;box-shadow:6px 6px 0 var(--ink);transform-origin:50% 50%;border:2px solid var(--ink);border-top:10px solid var(--hl)}
#ctaCard .k{display:inline-block;font:800 12px Mono;color:var(--ink);background:var(--hl);padding:3px 8px;text-transform:uppercase}
#ctaCard .q{font:52px/1.02 Titulo;color:var(--ink);margin-top:12px;text-transform:uppercase}
#ctaCard .a{font:500 21px/1.3 Texto;font-style:italic;color:#4a4a4a;margin-top:10px}
#perfil{position:absolute;left:150px;top:470px;width:420px;background:#fff;border:2px solid var(--ink);padding:30px 20px 24px;box-sizing:border-box;text-align:center;box-shadow:6px 6px 0 var(--ink)}
#perfil .av{width:120px;height:120px;border-radius:50%;margin:0 auto;background:var(--hl);padding:4px;box-sizing:border-box}
#perfil .av div{width:100%;height:100%;border-radius:50%;background:#fff center/cover;border:4px solid #fff;box-sizing:border-box;color:var(--ink);font:60px/104px Titulo}
#perfil .h{font:800 28px Texto;color:#111;margin-top:14px}
#perfil .nm{font:500 19px Texto;color:#666}
#perfil .bt{margin:18px auto 0;width:250px;padding:12px;font:800 22px Texto;color:var(--ink);background:var(--hl);border:2px solid var(--ink)}
#perfil .bt.on{background:#efefef;color:#111}

#leg{left:40px;right:40px;top:944px;display:flex;justify-content:center}
#leg .l{background:#fff;color:var(--ink);font:500 27px/1.25 Mono;padding:6px 14px 8px;border:1.5px solid var(--ink);box-shadow:3px 3px 0 #141414cc;max-width:640px;text-align:center}
#leg .k{box-shadow:inset 0 -4px 0 var(--hl);background:linear-gradient(transparent 55%,#ffd40099 55%)}
#leg .cur{display:inline-block;width:12px;height:28px;background:var(--hl);border:1px solid var(--ink);box-sizing:border-box;vertical-align:-5px;margin-left:2px}
/* letreiro de fontes: faixa preta, texto branco */
#ticker{left:0;right:0;bottom:20px;height:34px;display:flex;background:var(--ink);border-top:2px solid var(--hl);box-shadow:0 -6px 18px #0004}
#ticker .bd{flex:none;display:flex;align-items:center;gap:7px;padding:0 14px 0 6px;background:var(--hl);color:var(--ink);font:800 11px Mono;letter-spacing:.02em;position:relative;z-index:2}
#ticker .bd img{width:26px;height:26px;border-radius:50%;background:#fff}
#ticker .fx{flex:1;overflow:hidden;position:relative}
#ticker .tr{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;font:800 12px Mono;color:#fff;letter-spacing:.05em;text-transform:uppercase}
#ticker .tr b{color:var(--hl)}
#ticker .tr .sp{color:var(--hl);margin:0 16px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

/* capa: satélite realista + card de papel */
#capa{display:none;position:absolute;left:46px;right:46px;top:222px}
#capa .t1,#capa .t2{white-space:nowrap;font:104px/1.16 Titulo;letter-spacing:.01em;text-transform:uppercase}
#capa .t1{color:#fff;text-shadow:0 3px 0 #141414,0 0 14px #000c,2px 2px 0 #141414,-2px 2px 0 #141414}
#capa .t2{color:var(--ink);margin-top:2px}
#capa .t2 span{background:var(--hl);padding:0 12px;box-shadow:0 4px 14px #0008;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#capa .ln{display:inline-block;margin-top:16px;background:var(--ink);color:var(--hl);font:800 15px Mono;padding:5px 10px;text-transform:uppercase;box-shadow:0 3px 10px #0008}
#capa .rd{font:800 15px Mono;color:#fff;margin-top:10px;text-shadow:0 2px 0 #141414,0 0 10px #000}
#capaTag{display:none;left:46px;top:172px;background:var(--hl);color:var(--ink);font:800 16px Mono;padding:7px 13px;border:2px solid var(--ink);text-transform:uppercase;box-shadow:4px 4px 0 var(--ink)}
#capaLogo{display:none;right:34px;top:34px;width:88px;height:88px;border-radius:50%;border:3px solid var(--hl);background:#fff center/cover;box-shadow:0 6px 18px #0009}
body.capa #notas,body.capa #midia,body.capa #tag,body.capa #titulo,body.capa #leg,body.capa #ticker{display:none!important}
body.capa #vinheta{background:radial-gradient(ellipse at 50% 55%,transparent 45%,#00000080 100%),linear-gradient(to bottom,#000000b0 0%,#00000060 30%,transparent 48%,transparent 80%,#00000080 100%)}

/* stories (1080x1920 = 720x1280 @1.5x). Área segura: topo 167 / base 200 (unidades de 720) */
#st{display:none;position:absolute;inset:0}
body.story #st{display:block}
body.story #tag,body.story #titulo,body.story #leg,body.story #ticker,body.story #notas,body.story #midia,body.story #painel,body.story #capa{display:none!important}
#st .marca{position:absolute;left:34px;top:176px;display:flex;align-items:center;gap:10px;font:800 15px Mono;color:var(--ink);background:#fff;border:1.5px solid var(--ink);padding:4px 14px 4px 4px;box-shadow:3px 3px 0 var(--ink)}
#st .marca img{width:40px;height:40px;border-radius:50%;border:2px solid var(--hl)}
#st .hl{position:absolute;left:34px;transform-origin:0 50%;font:104px/1.0 Titulo;text-transform:uppercase;letter-spacing:.01em;color:var(--ink);padding:0 16px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);white-space:nowrap}
#st .hl.a{top:248px;background:#fff}
#st .hl.b{top:366px;background:var(--hl)}
#st .num{position:absolute;left:34px;top:500px;transform-origin:0 0;background:#fffdf7;border:3px solid var(--ink);border-left:12px solid var(--hl);padding:8px 24px 12px 20px;box-shadow:6px 6px 0 var(--ink)}
#st .num .v{font:132px/1 Titulo;color:var(--ink)}
#st .num .v small{font-size:60px;margin-left:4px}
#st .num .tx{font:34px/1.05 Titulo;color:var(--ink);text-transform:uppercase;margin-top:2px}
#st .cta{position:absolute;left:0;right:0;top:872px;text-align:center}
#st .cta .k{display:inline-block;background:var(--hl);color:var(--ink);font:68px/1 Titulo;padding:8px 24px 10px;text-transform:uppercase;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
#st .cta .s{display:inline-block;margin-top:16px;font:800 30px Texto;color:var(--ink);background:#fff;border:2px solid var(--ink);padding:4px 16px}
#st .cta .seta{display:block;margin:8px auto 0;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:30px solid var(--ink)}
#st .card{position:absolute;left:34px;right:34px;top:236px;background:#fffdf7;border:3px solid var(--ink);border-top:12px solid var(--hl);padding:22px 28px 26px;box-shadow:8px 8px 0 var(--ink)}
#st .card .k{display:inline-block;background:var(--ink);color:var(--hl);font:800 16px Mono;padding:4px 10px;text-transform:uppercase;letter-spacing:.05em}
#st .card .q{font:88px/1.04 Titulo;color:var(--ink);text-transform:uppercase;margin-top:14px}
#st .card .q em{font-style:normal;background:var(--hl);padding:0 8px}
#st .ops{position:absolute;left:34px;right:34px;top:880px;display:flex;gap:18px}
#st .ops div{flex:1;text-align:center;background:#fff;border:4px solid var(--ink);font:58px/1 Titulo;color:var(--ink);padding:26px 6px 22px;text-transform:uppercase;box-shadow:6px 6px 0 var(--ink)}
#st .ops div:last-child{background:var(--hl)}
#st .rod{position:absolute;left:0;right:0;top:1032px;text-align:center;font:800 16px Mono;color:var(--ink);letter-spacing:.06em;text-transform:uppercase}
#st .rod b{background:var(--hl);padding:0 6px}
</style>
</head>
<body class="jornal">
<div id="palco">
  <div id="mundo"><div id="plano"><div id="grade"></div>
    <svg id="mapa" width="1800" height="2600"><g id="cam"><g id="gSat"></g><g id="gEst"></g><g id="gMun"></g><g id="gEstL"></g><g id="gDest"></g><path id="rota"/><g id="gAnc"></g></g></svg>
  </div></div>
  <div id="horizonte"></div>
  <canvas id="c3d" width="720" height="1280" style="position:absolute;left:0;top:0;width:720px;height:1280px;pointer-events:none"></canvas>
  <div id="grao"></div>
  <div id="vinheta"></div>
  <div id="rotulos" class="ov" style="inset:0"></div>
  <div id="notas" class="ov" style="inset:0"></div>
  <div id="midia" class="ov" style="inset:0"></div>
  <div id="painel" style="display:none"></div>
  <div id="titulo" class="ov"></div>
  <div id="tag" class="ov"></div>
  <div id="leg" class="ov"></div>
  <div id="ticker" class="ov"><div class="bd"><img alt=""><span></span></div><div class="fx"><div class="tr"></div></div></div>
  <div id="capaTag" class="ov"></div>
  <div id="capaLogo" class="ov"></div>
  <div id="capa"><div class="t1"></div><div class="t2"></div><div class="ln"></div><div class="rd"></div></div>
  <div id="st"></div>
  <div id="flash"></div>
</div>
<script>
const CORES={vermelho:'#e0343f',laranja:'#f39a2b',amarelo:'#f2c230',verde:'#3f9a6b',azul:'#3b7dd8',roxo:'#8b5cf6'};
const $=(s)=>document.querySelector(s);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=(x)=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=(x)=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const outBack=(x,c=1.1)=>{x=cl(x);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const outCubic=(x)=>1-Math.pow(1-cl(x),3);
const outExpo=(x)=>{x=cl(x);return x>=1?1:(1-Math.pow(2,-10*x))/(1-Math.pow(2,-10))};
const nrm=(s)=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const esc=(s)=>String(s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SVGNS='http://www.w3.org/2000/svg';
let D,R,T,G,W=720,H=1280,CY=600,CAMY=1750,LMIN=200,LMAX=860;
let ilusList=[],munEls=[],grupos=[],gini=[],gfim=[],linhas=[],eventos=[],dests=[],notas=[],itens=[],titulos=[],fills=[],cards=[],punches=[],softs=[],ultimosFill=new Set(),pendentes=[];

function quando(cena,gatilho,padrao){
  if(gatilho){const g=nrm(gatilho.split(/\s+/)[0]);const w=T.palavras.find(p=>p.cena===cena&&nrm(p.txt).startsWith(g));if(w)return w.ini;}
  return padrao;
}
function punch(t){ // tranco de câmera + som (sem repetir em < 0,18 s)
  if(punches.some(p=>Math.abs(p-t)<.18))return;
  punches.push(t);eventos.push({t,tipo:'punch'});
}
function setCY(v){CY=v;if(window.C3D&&C3D.ok)C3D.setCY(v);$('#plano').style.transformOrigin=`360px ${CY}px`;$('#mundo').style.perspectiveOrigin=`360px ${CY}px`;
  $('#mapa').style.top=(CY-CAMY)+'px';$('#grade').style.top=(CY-CAMY)+'px';}
function carregaImg(src){return new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src;});}

// fundo de satélite: equiretangular -> Mercator (fatias de 1px de latitude)
async function constroiSat(){
  if(!D.sat||!G.sat)return;
  const im=await carregaImg(D.sat);if(!im)return;
  const S=G.sat,w=im.width,h=Math.min(3200,Math.round(w*(S.y1-S.y0)/(S.x1-S.x0)));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');
  const rad=Math.PI/180,mer=(d)=>Math.log(Math.tan(Math.PI/4+d*rad/2));

// ---------------- câmera ----------------
function camera(t){
  if(window.__capaCam){const b=G.cenas[__capaCam.i];return {cx:b.cx,cy:b.cy,s:b.s*(__capaCam.k||.92),i:__capaCam.i};}

    const a=G.cenas[i-1],k=outBack((t-cs[i].ini)/.55,1.25);
    const sa=a.s*(1+PUSH);

    const m=G.muns[b.ilustracao.idx],s0=3.6,k=outBack(t/1.7,1.0),cx0=m.cx,cy0=m.cy-120/s0;
    cx=cx0+(b.cx-cx0)*k;cy=cy0+(b.cy-cy0)*k;s=Math.exp(Math.log(s0)+(Math.log(s)-Math.log(s0))*k);

  s*=1+.035*Math.sin(t*1.1);cx+=Math.sin(t*.8)*18/s;cy+=Math.cos(t*.65)*14/s; // deriva: a imagem nunca para
  let whip=0;if(i>0&&grupos[i]!==grupos[i-1])whip=cl((t-cs[i].ini)/.45);

}

function aplicaFills(t,lista){

  for(const f of lista){if(t<f.t0-.01||t>=f.fim)continue;const n=f.ord.length;const prog=cl((t-f.t0)/(f.t1-f.t0));const lim=Math.ceil(prog*n);

// destaques + rótulos (posicionados pelo retângulo de um círculo-âncora dentro do SVG inclinado) + rota
function desenhaDests(t,c,iCena){
  const rotaPts=[],ocupado=[];
  for(const d of dests){
    const vis=t>=d.t0&&t<d.fim;
    d.g.style.display=(vis&&!d.h3)?'':'none';if(d.h3&&!vis)d.h3.set(0);d.pin.style.display=d.rot.style.display=vis?'':'none';
    if(!vis)continue;

    let lift=10*cl(a/.4);
    d.g.setAttribute('transform',`translate(${d.m.cx},${d.m.cy-lift/c.s}) scale(${.4+.6*k}) translate(${-d.m.cx},${-d.m.cy})`);
    d.g.style.filter=`drop-shadow(0 ${8/c.s}px 0 var(--sombraDest)) drop-shadow(0 ${18/c.s}px ${10/c.s}px #0009)`;
    d.g.style.opacity=sai;
    let x,y;
    if(d.h3){const h=36*outBack(a/.5,1.6)*sai;d.h3.set(h);[x,y]=C3D.projeta(d.m.cx,d.m.cy,h);lift=0;}
    else{const r=d.anc.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2;}
    if(x<-60||x>W+60||y<-60||y>H+60){d.pin.style.display=d.rot.style.display='none';}
    d.pin.style.left=x+'px';d.pin.style.top=(y-lift)+'px';d.pin.style.opacity=sai;
    const ring=(a*1.3)%1;d.pin.style.boxShadow=`0 2px 6px #0008,0 0 0 ${(ring*16).toFixed(1)}px rgba(255,212,0,${(.55*(1-ring)).toFixed(2)})`;
    const rw=d.rot.offsetWidth||180;let lx=x+16,ly=y-lift-62;if(lx+rw>W-16)lx=x-16-rw;lx=cl(lx,12,W-rw-12);ly=cl(ly,LMIN,LMAX);
    const rh=d.rot.offsetHeight||44;
    for(let tent=0;tent<6&&ocupado.some(o=>lx<o[0]+o[2]+6&&lx+rw+6>o[0]&&ly<o[1]+o[3]+6&&ly+rh+6>o[1]);tent++)ly+=(tent%2?-1:1)*(rh+8)*(tent+1);
    ly=cl(ly,LMIN,LMAX);ocupado.push([lx,ly,rw,rh]);
    d.rot.style.left=lx+'px';d.rot.style.top=ly+'px';
    const kr=outBack((a-.1)/.35,1.6);d.rot.style.opacity=cl((a-.1)/.12)*sai;d.rot.style.transform=`translateX(${(1-kr)*-40}px) scale(${.7+.3*kr})`;
    if(d.rota&&d.cena<=iCena)rotaPts.push([d.m.cx,d.m.cy,d.t0]);

  }

}

  // cartões de mídia
  for(const m of cards){const vis=t>=m.t0&&t<m.fim;m.el.style.display=vis?'':'none';if(!vis)continue;
    const a=t-m.t0,k=outBack(a/.6,1.2),inv=1-k,sai=cl((m.fim-t)/.3),fl=Math.sin(t*1.7+m.t0)*3;
    m.el.style.opacity=cl(a/.08)*sai;
    const base=m.tipo==='noticia'?`perspective(1000px) rotateY(${-9*k}deg) rotateX(${4*k}deg) `:'';
    m.el.style.transform=`translate(${m.dir*520*inv}px,${-80*inv+fl}px) ${base}rotate(${m.r+m.dir*100*inv}deg) scale(${.7+.3*k})`;
    if(m.tipo==='video'){
      const v=m.v;
      if(v.frames){const f=Math.floor(a*v.fps)%v.frames+1;setImg(m.img,v.prefixo+String(f).padStart(4,'0')+'.jpg');}
      else{setImg(m.img,v.miniUrl);m.img.style.transform=`scale(${1+.06*a})`;}
    }
  }
  // título
  const ti=[...titulos].reverse().find(x=>t>=x.ini-.001&&t<x.fim);
  const tbox=$('#titulo');
  if(ti){
    const tt=ti.c,a=t-ti.ini,kk=cl(a/.28);
    let l1;
    if(tt.numero!==undefined){
      l1=`<div class="l1${((tt.prefixo||'').length+String(tt.numero).length+(tt.unidade||'').length)>10?' longo':''}">${htmlNumero(tt,t,ti.cIni,ti.cFim)}</div>${tt.texto?`<div class="l2">${esc(tt.texto)}</div>`:''}`;
    }else l1=`<div class="l1 txt">${esc(tt.texto||'')}</div>${tt.linha2?`<div class="l2">${esc(tt.linha2)}</div>`:''}`;
    const circ=tt.circular?`<svg class="circ" viewBox="0 0 100 100" preserveAspectRatio="none"><path pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-ease((t-ti.ini-.4)/.5)}" vector-effect="non-scaling-stroke" d="M8 30 C 10 2, 92 0, 96 40 C 99 80, 40 104, 10 86 C -4 74, 2 40, 22 22"/></svg>`:'';
    tbox.innerHTML=`<div class="box">${l1}${circ}</div>${tt.sub?`<div class="sub">${esc(tt.sub)}</div>`:''}`;
    tbox.style.opacity=cl(a/.08)*cl((ti.fim-t)/.25);tbox.style.transform=`scale(${1+.4*(1-outCubic(kk))})`;
    tbox.style.filter=kk<1?`blur(${(8*(1-kk)).toFixed(1)}px)`:'';
  }else tbox.innerHTML='';
  // painel (lista / cta)
  const painel=$('#painel');
  if(cena.visual==='lista'||cena.visual==='cta'){
    painel.style.display='';const k=ease(u/.45);
    if(cena.visual==='lista'){painel.style.opacity=.93;painel.style.transform=`translateY(${(1-k)*100}%)`;}
    else{painel.style.background='#efe9dccc';painel.style.backgroundImage='none';painel.style.opacity=k;painel.style.transform='';}
    if(!painel.dataset.cena||+painel.dataset.cena!==i){
      painel.innerHTML='';painel.dataset.cena=i;
      if(cena.visual==='lista')itens.filter(x=>x.cena===i).forEach(x=>painel.appendChild(x.el));
      if(cena.visual==='cta'){
        painel.innerHTML=`<div id="ctaCard"><div class="k">${esc(cena.capitulo||'')}</div><div class="q">${esc(cena.pergunta||'')}</div><div class="a">${esc(cena.apoio||'')}</div></div>
        <div id="perfil"><div class="av"><div>${esc((D.cfg.canal.nome||'?')[0])}</div></div><div class="h">${esc(D.cfg.canal.handle.replace('@',''))}</div><div class="nm">${esc(D.cfg.canal.nome)}</div><div class="bt">Seguir</div></div>`;
        if(D.cfg.canal.avatar){const a=painel.querySelector('.av div');a.style.backgroundImage=`url(${D.cfg.canal.avatar})`;a.textContent='';}
      }
    }
    for(const x of itens.filter(x=>x.cena===i)){const a=t-x.t0,k=outBack(a/.5,1.5),inv=1-k;x.el.style.opacity=cl(a/.1);
      x.el.style.transform=`translate(${x.dir*300*inv}px,${-60*inv}px) rotate(${x.r+x.dir*40*inv}deg) scale(${a<0?.6:.7+.3*k})`;
      x.el.querySelector('path').style.strokeDasharray='90';x.el.querySelector('path').style.strokeDashoffset=90*(1-ease((a-.45)/.35));}
    if(cena.visual==='cta'){
      const card=$('#ctaCard'),pf=$('#perfil'),tf=T.duracao-2.6;
      const kc=outBack((u-.15)/.5,1.5);card.style.opacity=cl((u-.15)/.15)*(t<tf?1:cl(1-(t-tf)/.3));card.style.transform=`rotate(${-1.5-(1-kc)*30}deg) scale(${.6+.4*kc})`;
      const kp=outBack((t-tf)/.5,1.5);pf.style.opacity=cl((t-tf)/.2);pf.style.transform=`scale(${.6+.4*kp}) rotate(${t<tf+.5?(1-kp)*-8:0}deg)`;
      const bt=pf.querySelector('.bt');const on=t>=T.duracao-1.7;bt.className='bt'+(on?' on':'');bt.textContent=on?'Seguindo ✓':'Seguir';
      bt.style.transform=`scale(${Math.abs(t-(T.duracao-1.7))<.12?.92:1})`;
    }
  }else{painel.style.display='none';painel.dataset.cena='';}
  // legenda
  const ln=linhas.find(l=>t>=l.ini-.02&&t<l.fim);
  if(ln&&modo!=='capa'){
    let h='';
    ln.ws.forEach((w,k)=>{
      const n=w.letras.filter(x=>x<=t).length;if(n===0)return;
      const s=esc(w.txt.slice(0,n));h+=(k&&h?' ':'')+(w.chave&&n===w.txt.length?`<span class="k">${s}</span>`:s);
    });
    const ultimo=ln.ws.at(-1);const mostraCur=t<ultimo.fim+.25;
    $('#leg').innerHTML=h?`<div class="l">${h}${mostraCur?'<span class="cur"></span>':''}</div>`:'';
  }else $('#leg').innerHTML='';
  // letreiro de fontes (rola sem parar)
  $('#ticker .tr').style.transform=`translateX(${-((t*80)%tickerW).toFixed(1)}px)`;
  // flash (relâmpago)
  $('#flash').style.opacity=Math.max(cena.flash&&u>=0&&u<.35?(.85*(1-u/.35)):0,window.C3D&&C3D.ok?C3D.flashAmt()*.35:0);
};

window.eventos=()=>eventos.sort((a,b)=>a.t-b.t);

window.capa=async function(cp){
  document.body.classList.add('sat','capa');
  const i=cp.cena??0;const t=Math.max(T.cenas[i].ini,T.cenas[i].fim-.45);
  // layout da capa: título só em texto no terço superior; região da notícia no centro-inferior (dentro do corte 3:4 do Instagram: y 160..1120)
  setCY(cp.cy??870);LMIN=590;LMAX=1090;window.__capaCam={i,k:cp.zoom??1.3};
  const c=$('#capa');c.style.display='block';
  c.querySelector('.t1').textContent=cp.titulo[0]||'';c.querySelector('.t2').innerHTML='<span></span>';c.querySelector('.t2 span').textContent=cp.titulo[1]||'';
  c.querySelector('.ln').textContent=cp.linha||'';c.querySelector('.rd').textContent=cp.rodape||'';
  await document.fonts.ready;
  for(const el of [c.querySelector('.t1'),c.querySelector('.t2')]){let f=104;while(f>56&&el.scrollWidth>628){f-=4;el.style.fontSize=f+'px';}}
  if(cp.tag){const g=$('#capaTag');g.style.display='block';g.textContent='● '+cp.tag;}
  const lg=$('#capaLogo');lg.style.display='block';lg.style.backgroundImage=`url(${D.cfg.canal.avatar})`;
  renderAt(t,'capa');
  const ocup=c.getBoundingClientRect().bottom;
  // verifica sobreposição entre o texto e os rótulos/pins da região
  let topo=1e9;for(const d of dests){if(d.pin.style.display==='none')continue;topo=Math.min(topo,d.pin.getBoundingClientRect().top,d.rot.getBoundingClientRect().top);}
  window.__capaInfo={textoFim:Math.round(ocup),regiaoTopo:Math.round(topo)};
};

/* ===================== STORIES ===================== */
let ST=null;
// cfg = stories.json; tipo = 'animado' | 'imagem'
window.storyInit=async function(cfg,tipo){
  ST={cfg,tipo};
  document.body.classList.add('story');
  setCY(740);LMIN=610;LMAX=850;
  const idx=cfg.cena??0;
  const cab=`<div class="marca"><img src="${D.cfg.canal.avatar}"><span>${esc(D.cfg.canal.handle)}</span></div>`;
  const hs=cfg.manchete||[];
  if(tipo==='animado'){
    const n=cfg.numero;
    $('#st').innerHTML=`${cab}<div class="hl a">${esc(hs[0]||'')}</div><div class="hl b">${esc(hs[1]||'')}</div>
      ${n?`<div class="num"><div class="v"></div>${n.texto?`<div class="tx">${esc(n.texto)}</div>`:''}</div>`:''}
      <div class="cta"><div class="k">Novo vídeo no perfil</div><div class="s">Toque para <span>assistir</span></div><i class="seta"></i></div>`;
  }else{
    const e=cfg.enquete;
    if(e){
      $('#st').innerHTML=`${cab}<div class="card"><span class="k">Enquete · ${esc(D.cfg.canal.nome)}</span><div class="q">${esc(e.pergunta)}</div></div>
        <div class="ops">${(e.opcoes||['SIM','NÃO']).map(o=>`<div>${esc(o)}</div>`).join('')}</div>
        <div class="rod">${esc(cfg.chamada||'')} <b>${esc(D.cfg.canal.handle)}</b></div>`;
    }else{
      const n=cfg.numero;
      $('#st').innerHTML=`${cab}<div class="card"><span class="k">${esc(cfg.chamada||'Alerta')}</span><div class="q">${esc(hs[0]||'')} <em>${esc(hs[1]||'')}</em></div></div>
        ${n?`<div class="num" style="top:780px"><div class="v"></div>${n.texto?`<div class="tx">${esc(n.texto)}</div>`:''}</div>`:''}
        <div class="rod">${esc(D.cfg.canal.nome)} · <b>${esc(D.cfg.canal.handle)}</b></div>`;
    }
  }
  // tempos do mapa neste story: só os destaques/preenchimentos da cena escolhida
  const ds=dests.filter(d=>d.cena===idx),fs_=fills.filter(f=>f.cena===idx);
  const anim=tipo==='animado';
  dests.forEach(d=>{d.t0=1e9;d.fim=1e9+1;});fills.forEach(f=>{f.t0=1e9;f.t1=1e9+1;f.fim=1e9+2;});
  ds.forEach((d,k)=>{d.t0=anim?3.2+k*(4.4/Math.max(1,ds.length)):0;d.fim=anim?99:1e9;});
  fs_.forEach(f=>{f.t0=anim?3.4:0;f.t1=anim?7.2:.01;f.fim=99;});
  ST.ds=ds;ST.fs=fs_;ST.idx=idx;
  // eventos de som / trancos do story
  eventos.length=0;punches.length=0;
  if(anim){
    punch(.25);punch(.65);punch(1.3);
    eventos.push({t:.25,tipo:'impacto'},{t:.65,tipo:'impacto'},{t:1.3,tipo:'impacto'},{t:.1,tipo:'whoosh'});
    const n=cfg.numero;if(n){const de=n.de??(n.numero>10?0:n.numero),nt=Math.min(16,Math.max(0,Math.round(Math.abs(n.numero-de))));
      for(let k=1;k<=nt;k++){const x=k/nt,p=-Math.log2(1-x*(1-Math.pow(2,-10)))/10;eventos.push({t:1.5+p*2.4,tipo:'tick'});}}
    ds.forEach(d=>{eventos.push({t:d.t0,tipo:'pop'});punch(d.t0);});
    fs_.forEach(f=>{eventos.push({t:f.t0,tipo:'varrer'});punch(f.t0);});
    eventos.push({t:8.3,tipo:'whoosh'},{t:8.5,tipo:'impacto'},{t:9.3,tipo:'clique'},{t:10.4,tipo:'clique'});punch(8.5);punch(9.3);
  }
  await document.fonts.ready;
  return true;
};
window.storyDur=()=>12;
window.renderStory=function(t){
  const {cfg,tipo,idx}=ST,anim=tipo==='animado';
  const b=G.cenas[idx];
  let s=b.s*(anim?(.55+.45*outCubic(t/3.2))*(1+.05*cl((t-3.2)/8)):1),cx=b.cx,cy=b.cy;
  s*=1+.03*Math.sin(t*1.1);cx+=Math.sin(t*.8)*18/s;cy+=Math.cos(t*.65)*14/s;
  const c={cx,cy,s,i:idx};
  aplicaCamera(anim?t:14,c,anim?zpunch(t):{z:0,dx:0,dy:0});
  const tt=anim?t:99;
  aplicaFills(tt,fills);desenhaDests(tt,c,idx);desenhaIlus(tt,c);
  const q=(sel)=>$('#st '+sel);
  const slam=(el,t0,x=1.4)=>{if(!el)return;const a=tt-t0,k=cl(a/.28);el.style.opacity=cl(a/.08);el.style.transform=`scale(${1+(x-1)*(1-outCubic(k))})`;el.style.filter=k<1?`blur(${(8*(1-k)).toFixed(1)}px)`:'';};
  if(anim){
    slam(q('.hl.a'),.25);slam(q('.hl.b'),.65);
    const n=cfg.numero,nb=q('.num');
    if(n&&nb){slam(nb,1.3,1.5);nb.querySelector('.v').innerHTML=htmlNumero(n,t,1.5,3.9);}
    const cta=q('.cta');
    if(cta){const a=t-8.4;cta.style.display=a>=0?'':'none';const k=outBack(a/.45,1.8);
      cta.querySelector('.k').style.transform=`scale(${.4+.6*k}) rotate(${(1-k)*-14}deg)`;cta.style.opacity=cl(a/.08);
      cta.querySelector('.s').style.opacity=cl((t-9.2)/.2);
      cta.querySelector('.seta').style.transform=`translateY(${Math.abs(Math.sin((t-9.3)*7))*16}px)`;cta.querySelector('.seta').style.opacity=cl((t-9.3)/.2);}
  }else{
    const n=cfg.numero,nb=q('.num');if(n&&nb)nb.querySelector('.v').innerHTML=htmlNumero(n,99,0,1);
  }
};
</script>
