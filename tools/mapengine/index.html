<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Saira Stencil One";src:url(fonts/SairaStencilOne-Regular.ttf)}
@font-face{font-family:"Stardos Stencil";src:url(fonts/StardosStencil-Bold.ttf)}
@font-face{font-family:"Black Ops One";src:url(fonts/BlackOpsOne-Regular.ttf)}
@font-face{font-family:"Barlow Condensed";src:url(fonts/BarlowCondensed-SemiBold.ttf)}
@font-face{font-family:"Allerta Stencil";src:url(fonts/AllertaStencil-Regular.ttf)}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
</style></head><body>
<script type="module">
import { MapEngine } from './engine.js';
import { PLACES, CANALS } from './places.js';
import { SCENES } from './scenes.js';
const geo = await (await fetch('geo_west1940.json')).json();
for (const f of ['Saira Stencil One','Stardos Stencil','Black Ops One','Barlow Condensed']) await document.fonts.load(`40px "${f}"`);
const eng = new MapEngine(geo, PLACES);
window.eng = eng; window.SCENES = SCENES;
window.loadScene = (id) => { const sc = SCENES[id]; eng.buildMap({ canals: CANALS, ...(sc.map || {}) }); eng.load(sc); return sc.dur; };
window.ready = true;
</script></body></html>
