# Site completo do Estúdio do Nogueira: página de venda + Área do Estúdio com login.
# Montado e publicado por produto/site/publicar-tudo.sh (o Claude roda).

[build]
  publish = "dist"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[functions]
  node_bundler = "esbuild"

# O porteiro da Área: roda antes de qualquer página ou arquivo em /area/, menos a tela de entrar.
[[edge_functions]]
  function = "porteiro"
  path = "/area/*"
  excludedPath = ["/area/entrar.html"]
