<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../amostras/node_modules/@fontsource/anton/index.css">
<link rel="stylesheet" href="../amostras/node_modules/@fontsource/nunito/700.css">
<link rel="stylesheet" href="../amostras/node_modules/@fontsource/nunito/900.css">
<style>body{margin:0;width:1080px;height:1920px;background:#FFF8EC;color:#2B2420;font-family:Nunito}
.h{padding:44px 48px 10px}.chip{display:inline-block;background:#F2C14E;border-radius:99px;padding:6px 16px;font:900 20px Nunito;letter-spacing:2px}
h1{font:400 80px Anton;margin:10px 0 0;line-height:1}.sub{font:700 24px Nunito;margin-top:8px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:16px 48px}
.c{background:#fff;border-radius:20px;overflow:hidden;text-align:center;padding-bottom:12px}
.c svg{background:#E9DCC6;display:block}.n{font:900 22px Nunito;margin-top:8px}.m{font:700 16px/1.25 Nunito;opacity:.7;padding:2px 10px}
</style></head><body>
<div class="h"><span class="chip">FOLHA DE DESIGN · FIGURANTES · RASCUNHO 1</span><h1>Gente da cidade</h1><div class="sub">Todo mundo tem rosto, idade, jeito e uma marca. Congelados no meio do que estavam fazendo.</div></div>
<div class="g" id="g"></div>
<script src="gente.js"></script><script>
document.getElementById('g').innerHTML=Object.values(FIGURANTES).map(f=>`<div class="c"><svg viewBox="0 0 400 1720" width="100%" height="700" preserveAspectRatio="xMidYMax meet">${pessoa(f)}</svg><div class="n">${f.nome}</div><div class="m">${f.marca}</div></div>`).join('');
</script></body></html>
