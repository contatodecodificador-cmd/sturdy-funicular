*{box-sizing:border-box}
body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:Nunito,sans-serif}
.board{width:1080px;height:1920px;padding:48px 48px 0;position:relative}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.chip{display:inline-block;padding:6px 16px;border-radius:999px;font:900 22px Nunito;letter-spacing:2px}
.name{font-size:76px;line-height:1;margin-top:12px}
.mood{font:700 26px Nunito;margin-top:10px;opacity:.85;max-width:980px}
.row{display:flex;gap:36px}
.frame{width:540px;height:960px;border-radius:26px;overflow:hidden;position:relative;flex:none;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.frame svg{display:block}
.col{flex:1;display:flex;flex-direction:column;gap:22px}
.card{border-radius:22px;padding:18px 20px}
.lbl{font:900 18px Nunito;letter-spacing:2px;opacity:.7;margin-bottom:10px;text-transform:uppercase}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw div{height:74px;border-radius:12px;display:flex;align-items:flex-end;padding:6px 8px;font:700 15px Nunito}
.sw span{background:rgba(255,255,255,.85);color:#222;border-radius:6px;padding:1px 6px}
.bul{display:grid;grid-template-columns:1fr 1fr;gap:16px 34px;margin-top:30px}
.bul div{font:700 22px/1.35 Nunito}
.bul b{display:block;font:900 17px Nunito;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px}

}

function cena(){
  const h=d.houses; let s='';
  s+=`<defs><linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${d.sky[0]}"/><stop offset="1" stop-color="${d.sky[1]}"/></linearGradient>

  <rect width="1080" height="1920" fill="url(#ceu)"/>`;
  if(d.mode==='soft') s+=`<circle cx="820" cy="560" r="120" fill="#FFF1C9" opacity=".9"/>`;
  else if(d.mode==='cel') s+=`<circle cx="860" cy="330" r="70" fill="#FFF4C2"/>`;
  // casario de fundo
  const xs=[-20,170,330,640,800,960];
  xs.forEach((x,i)=>{const w=i==5?200:180, top=820+(i%2)*60;
    s+=`<rect x="${x}" y="${top}" width="${w}" height="${1300-top}" fill="${h[i]}"/>
    <path d="M${x-10},${top} L${x+w/2},${top-70} L${x+w+10},${top}Z" fill="${d.roof}"/>`;
    for(let r=0;r<3;r++)for(let c=0;c<2;c++)s+=`<rect x="${x+30+c*70}" y="${top+40+r*120}" width="44" height="74" rx="${d.mode==='soft'?20:4}" fill="#fff" opacity=".75"/><rect x="${x+30+c*70}" y="${top+40+r*120}" width="44" height="74" rx="${d.mode==='soft'?20:4}" fill="none" stroke="${d.roof}" stroke-width="4" opacity=".5"/>`;
  });
  // prefeitura
  s+=`<rect x="420" y="700" width="240" height="600" fill="${h[3]}" stroke="${d.roof}" stroke-width="4"/>
  <rect x="490" y="560" width="100" height="150" fill="${h[3]}" stroke="${d.roof}" stroke-width="4"/>
  <path d="M480,560 L540,490 L600,560Z" fill="${d.roof}"/><circle cx="540" cy="625" r="34" fill="#fff" stroke="${d.roof}" stroke-width="5"/>
  <path d="M540,625 L540,602 M540,625 L556,632" stroke="${d.roof}" stroke-width="5" stroke-linecap="round"/>
  <line x1="540" y1="490" x2="540" y2="420" stroke="${d.roof}" stroke-width="5"/><rect x="540" y="420" width="60" height="38" fill="${d.pal[1][1]}"/>
  <rect x="505" y="1130" width="70" height="170" rx="35" fill="${d.roof}"/>`;
  // chão e árvore
  s+=`<rect y="1290" width="1080" height="630" fill="${d.ground}"/>`;
  for(let i=0;i<9;i++) s+=`<path d="M${i*130-40},1340 q40,-30 80,0 t80,0" stroke="${d.walk}" stroke-width="10" fill="none"/><path d="M${i*130-80},1440 q40,-30 80,0 t80,0" stroke="${d.walk}" stroke-width="10" fill="none"/>`;
  s+=`<rect x="70" y="1000" width="34" height="320" fill="${d.roof}"/><circle cx="87" cy="960" r="130" fill="${d.tree}"/><circle cx="20" cy="1030" r="90" fill="${d.treeD}"/><circle cx="160" cy="1020" r="95" fill="${d.treeD}"/>`;
  if(d.mode==='soft') s+=`<rect width="1080" height="1920" fill="#B9A7DB" opacity=".12"/>`;
  // personagem
  s+=`<g transform="translate(150,723) scale(1.6)">${pessoa('f')}</g>`;
  if(d.mode==='grad') s+=`<rect width="1080" height="1920" fill="url(#vin)"/>`;
  return s;
}
function hud(){
  const H=d.hud, F=d.infoFont, w=d.mode==='grad'?'600':'800';

  // legenda palavra por palavra (abaixo do rosto, acima da zona dos botões)
  const y=1395;
  if(d.capBox){
    s+=`<rect x="80" y="${y-96}" width="420" height="118" fill="#13294B"/><text x="100" y="${y}" font-family="${d.capFont}" font-size="${d.capSize}" fill="#fff">ESTÁ</text>
    <rect x="80" y="${y+40}" width="690" height="128" fill="${d.capBox}"/><text x="100" y="${y+140}" font-family="${d.capFont}" font-size="${d.capSize}" fill="${d.capHi}">PROIBIDA</text>`;
  } else {
    const sw=d.mode==='soft'?22:18;
    s+=`<text x="470" y="${y}" text-anchor="middle" font-family="${d.capFont}" font-weight="800" font-size="${d.capSize}" fill="${d.capColor}" stroke="${d.capStroke}" stroke-width="${sw}" paint-order="stroke" stroke-linejoin="round">ESTÁ</text>
    <text x="470" y="${y+d.capSize+10}" text-anchor="middle" font-family="${d.capFont}" font-weight="800" font-size="${d.capSize*1.12}" fill="${d.capHi}" stroke="${d.capStroke}" stroke-width="${sw}" paint-order="stroke" stroke-linejoin="round">PROIBIDA</text>`;
  }
  // zonas proibidas (só na amostra)
  s+=`<rect x="0" y="1540" width="1080" height="380" fill="#000" opacity=".18"/><rect x="940" y="0" width="140" height="1540" fill="#000" opacity=".10"/>
  <text x="540" y="1740" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="30" fill="#fff" opacity=".8">zona dos botões · nada importante aqui</text>`;
  return s;
}
